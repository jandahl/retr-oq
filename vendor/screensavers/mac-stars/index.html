<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stars</title>
    <style>
      html, body {
        margin: 0;
        background: #000;
        overflow: hidden;
        width: 100%;
        height: 100%;
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <canvas role="img" aria-label="Starfield"></canvas>
    <script>
      (function () {
        "use strict";

        var MAC_W = 512;
        var MAC_H = 342;
        var BLACK = "#000";
        var WHITE = "#fff";
        var Z_NEAR = 8;
        var Z_FAR = 520;
        var SPEED = 26;

        var canvas = document.querySelector("canvas");
        var ctx = canvas.getContext("2d", { alpha: false });
        var stars = [];
        var last = 0;
        var raf = 0;
        var reduced = false;
        var cx = 0;
        var cy = 0;
        var focal = 140;
        var motionQuery = window.matchMedia
          ? window.matchMedia("(prefers-reduced-motion: reduce)")
          : null;

        function spawn(atFar) {
          var a = Math.random() * Math.PI * 2;
          var r = (0.15 + Math.random()) * 240;
          return {
            x: Math.cos(a) * r,
            y: Math.sin(a) * r * (MAC_H / MAC_W),
            z: atFar ? Z_FAR - Math.random() * 40 : Z_NEAR + Math.random() * (Z_FAR - Z_NEAR)
          };
        }

        function fit() {
          var w = window.innerWidth || MAC_W;
          var h = window.innerHeight || MAC_H;
          var cell = Math.max(1, Math.round(Math.min(w / MAC_W, h / MAC_H)));
          var lw = Math.max(1, Math.floor(w / cell));
          var lh = Math.max(1, Math.floor(h / cell));
          if (canvas.width !== lw || canvas.height !== lh) {
            canvas.width = lw;
            canvas.height = lh;
            ctx.imageSmoothingEnabled = false;
          }
          cx = (lw / 2) | 0;
          cy = (lh / 2) | 0;
          focal = Math.min(lw, lh) * 0.44;
          var n = Math.max(64, Math.round(120 * (lw * lh) / (MAC_W * MAC_H)));
          if (stars.length !== n) {
            stars.length = 0;
            for (var i = 0; i < n; i++) stars.push(spawn(false));
          }
        }

        function plot(ix, iy, z) {
          if (z > 280) {
            ctx.fillRect(ix, iy, 1, 1);
          } else if (z > 150) {
            ctx.fillRect(ix, iy, 2, 2);
          } else if (z > 70) {
            ctx.fillRect(ix, iy, 3, 3);
          } else {
            ctx.fillRect(ix, iy, 4, 4);
          }
        }

        function draw() {
          var w = canvas.width;
          var h = canvas.height;
          ctx.fillStyle = BLACK;
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = WHITE;
          for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            var z = s.z;
            if (z < Z_NEAR) continue;
            var px = (s.x * focal) / z + cx;
            var py = (s.y * focal) / z + cy;
            var ix = Math.round(px);
            var iy = Math.round(py);
            if (ix < -4 || iy < -4 || ix > w + 4 || iy > h + 4) continue;
            plot(ix, iy, z);
          }
        }

        function tick(now) {
          raf = 0;
          if (document.hidden || reduced) return;
          var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
          last = now;
          var dz = SPEED * dt;
          for (var i = 0; i < stars.length; i++) {
            stars[i].z -= dz;
            if (stars[i].z < Z_NEAR) stars[i] = spawn(true);
          }
          draw();
          raf = requestAnimationFrame(tick);
        }

        function stopLoop() {
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
          last = 0;
        }

        function startLoop() {
          if (reduced || document.hidden || raf) return;
          last = 0;
          raf = requestAnimationFrame(tick);
        }

        function applyMotionPref() {
          reduced = !!(motionQuery && motionQuery.matches);
          fit();
          draw();
          if (reduced) stopLoop();
          else startLoop();
        }

        function onResize() {
          fit();
          draw();
        }

        function onVisibility() {
          if (document.hidden) stopLoop();
          else if (!reduced) startLoop();
        }

        applyMotionPref();
        window.addEventListener("resize", onResize);
        document.addEventListener("visibilitychange", onVisibility);
        if (motionQuery) {
          if (motionQuery.addEventListener) motionQuery.addEventListener("change", applyMotionPref);
          else if (motionQuery.addListener) motionQuery.addListener(applyMotionPref);
        }
      })();
    </script>
    <script src="../../../shared/redmond/ss-exit.js?v=3"></script>
  </body>
</html>
