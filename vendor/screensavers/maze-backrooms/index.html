<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Backrooms</title>
    <style>
      html, body { margin: 0; overflow: hidden; background: #c4b44a; }
      #container { width: 100%; height: 100%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r71/three.min.js"></script>
    <script>
      function crunch(t) {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.magFilter = t.minFilter = THREE.NearestFilter;
        t.generateMipmaps = false;
        return t;
      }
      function paintWall(g) {
        g.fillStyle = "#e6d65c";
        g.fillRect(0, 0, 64, 64);
        g.fillStyle = "#dccb4e";
        for (var x = 0; x < 64; x += 8) g.fillRect(x, 0, 2, 64);
      }
      function paintRedWall(g) {
        g.fillStyle = "#c45a46";
        g.fillRect(0, 0, 64, 64);
        g.fillStyle = "#b04a38";
        for (var x = 0; x < 64; x += 8) g.fillRect(x, 0, 2, 64);
      }
      function paintCeil(g) {
        g.fillStyle = "#d4ccb0";
        g.fillRect(0, 0, 64, 64);
        g.strokeStyle = "#b8b090";
        g.strokeRect(0.5, 0.5, 63, 63);
        g.beginPath();
        g.moveTo(32, 0); g.lineTo(32, 64);
        g.stroke();
      }
      function canvasTex(draw) {
        var c = document.createElement("canvas");
        c.width = c.height = 64;
        draw(c.getContext("2d"));
        var t = new THREE.Texture(c);
        t.needsUpdate = true;
        return crunch(t);
      }
      function paintWallN(g, s) {
        g.fillStyle = "#e6d65c";
        g.fillRect(0, 0, s, s);
        g.fillStyle = "#dccb4e";
        var stripe = Math.max(2, s / 32);
        var step = s / 8;
        for (var x = 0; x < s; x += step) g.fillRect(x, 0, stripe, s);
      }
      function canvasTexFine(draw, size) {
        var c = document.createElement("canvas");
        c.width = c.height = size;
        draw(c.getContext("2d"), size);
        var t = new THREE.Texture(c);
        t.needsUpdate = true;
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.magFilter = t.minFilter = THREE.LinearFilter;
        t.generateMipmaps = false;
        return t;
      }
      THREE.ImageUtils = THREE.ImageUtils || {};
      THREE.ImageUtils.loadTexture = function (url) {
        var name = String(url);
        if (name.indexOf("floor") !== -1) {
          return canvasTex(function (g) {
            g.fillStyle = "#c8b45a";
            g.fillRect(0, 0, 64, 64);
            g.fillStyle = "#beaa50";
            for (var y = 0; y < 64; y += 4) {
              for (var x = 0; x < 64; x += 4) {
                if ((x + y) % 8 === 0) g.fillRect(x, y, 2, 2);
              }
            }
          });
        }
        if (name.indexOf("ceil") !== -1) {
          return canvasTex(paintCeil);
        }
        return canvasTex(paintWall);
      };
    </script>
    <script src="js/maze.js"></script>
  </head>
  <body>
    <div id="container"></div>
    <script>
      var CELL = 5;
      // Test knobs: ?missing=12&outlets=20&wet=16&exit=4&red=1&bay=1&warp=0&fisheye=70&crt=70&vhs=70&eye=floor
      function q(name, fallback) {
        var m = String(location.search).match(new RegExp("[?&]" + name + "=([^&]*)"));
        if (!m) return fallback;
        var n = parseFloat(decodeURIComponent(m[1].replace(/\+/g, " ")));
        return isFinite(n) ? n : fallback;
      }
      function qHas(name) {
        return new RegExp("[?&]" + name + "=").test(String(location.search));
      }
      function qflag(name, chance) {
        return qHas(name) ? q(name, 0) > 0 : Math.random() < chance;
      }
      function pickEye() {
        var m = String(location.search).match(/[?&]eye=([^&]*)/);
        var raw = m ? decodeURIComponent(m[1].replace(/\+/g, " ")).toLowerCase() : null;
        if (raw === "floor" || raw === "-1") return -1.7;
        if (raw === "ceil" || raw === "ceiling" || raw === "1") return 1.7;
        if (raw === "mid" || raw === "0") return 0;
        if (raw && isFinite(parseFloat(raw))) return Math.max(-2.1, Math.min(2.1, parseFloat(raw)));
        var r = Math.random();
        if (r < 0.12) return -1.7;
        if (r < 0.24) return 1.7;
        return 0;
      }
      var odds = {
        missing: Math.max(0, Math.round(q("missing", 2))),
        outlets: Math.max(0, Math.round(q("outlets", 3))),
        wet: Math.max(0, Math.round(q("wet", 4))),
        exit: Math.max(0, Math.round(q("exit", 1))),
        red: q("red", 1) > 0,
        bay: q("bay", 1) > 0,
        warp: q("warp", 1) > 0,
        fisheye: qHas("fisheye") ? Math.max(0, Math.min(1, q("fisheye", 0) / 100)) : Math.pow(Math.random(), 1.7),
        crt: qHas("crt") ? Math.max(0, Math.min(1, q("crt", 0) / 100)) : 0.32,
        vhs: qHas("vhs") ? Math.max(0, Math.min(1, q("vhs", 0) / 100)) : 0.22
      };
      var _eyeY = pickEye();
      var _cam = new THREE.PerspectiveCamera(70 + odds.fisheye * 48, window.innerWidth / window.innerHeight, 0.15, 36 + odds.fisheye * 10);
      var _webgl = new THREE.WebGLRenderer({ antialias: false });
      var _walker;
      var _mazeRenderer;
      var _sprites = [];
      var _wallMap = THREE.ImageUtils.loadTexture("img/brickwall.jpg");
      var _missingMat = new THREE.MeshLambertMaterial({
        side: THREE.DoubleSide,
        map: canvasTex(function (g) {
          g.fillStyle = "#080806";
          g.fillRect(0, 0, 64, 64);
          g.strokeStyle = "#1a1810";
          g.strokeRect(1, 1, 62, 62);
        })
      });
      var _wetMat = new THREE.MeshLambertMaterial({
        side: THREE.DoubleSide,
        map: canvasTex(function (g) {
          g.fillStyle = "#8a7438";
          g.fillRect(0, 0, 64, 64);
          g.fillStyle = "#7a642c";
          for (var y = 0; y < 64; y += 4) { for (var x = 0; x < 64; x += 4) { if ((x + y) % 8 === 0) g.fillRect(x, y, 2, 2); } }
          g.globalAlpha = 0.28;
          g.fillStyle = "#5a4818";
          g.beginPath(); g.arc(34, 38, 18, 0, Math.PI * 2); g.fill();
          g.globalAlpha = 1;
        })
      });
      var _exitMat = new THREE.MeshLambertMaterial({
        side: THREE.DoubleSide,
        map: canvasTexFine(function (g, s) {
          paintWallN(g, s);
          var pw = Math.round(s * 0.12);
          var ph = Math.round(s * 0.055);
          var px = s - pw - Math.round(s * 0.07);
          var py = s - ph - Math.round(s * 0.1);
          g.fillStyle = "#2a2810";
          g.fillRect(px, py, pw, ph);
          g.fillStyle = "#d4c878";
          g.font = "bold " + Math.max(8, Math.round(ph * 0.7)) + "px sans-serif";
          g.textAlign = "center";
          g.textBaseline = "middle";
          g.fillText("EXIT", px + pw / 2, py + ph / 2 + 0.5);
        }, 256)
      });
      var _redMat = new THREE.MeshLambertMaterial({
        side: THREE.DoubleSide,
        map: canvasTex(paintRedWall)
      });
      var _redFloorMat = new THREE.MeshLambertMaterial({
        side: THREE.DoubleSide,
        map: canvasTex(function (g) {
          g.fillStyle = "#8a4030";
          g.fillRect(0, 0, 64, 64);
          g.fillStyle = "#7a3428";
          for (var y = 0; y < 64; y += 4) {
            for (var x = 0; x < 64; x += 4) {
              if ((x + y) % 8 === 0) g.fillRect(x, y, 2, 2);
            }
          }
        })
      });
      var _outletMat = new THREE.MeshLambertMaterial({
        side: THREE.DoubleSide,
        map: canvasTexFine(function (g, s) {
          paintWallN(g, s);
          var w = Math.round(s * 0.05);
          var h = Math.round(s * 0.08);
          var x = Math.round(s * 0.47);
          var y = Math.round(s * 0.62);
          g.fillStyle = "#e8e2cc";
          g.fillRect(x, y, w, h);
          g.strokeStyle = "#b0a88e";
          g.lineWidth = 1;
          g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
          var sw = Math.max(2, Math.round(w * 0.22));
          var sh = Math.max(3, Math.round(h * 0.2));
          g.fillStyle = "#3a3828";
          g.fillRect(x + w * 0.22, y + h * 0.16, sw, sh);
          g.fillRect(x + w * 0.56, y + h * 0.16, sw, sh);
          g.fillRect(x + w * 0.22, y + h * 0.55, sw, sh);
          g.fillRect(x + w * 0.56, y + h * 0.55, sw, sh);
        }, 256)
      });
      var _warpT0 = (typeof performance !== "undefined" ? performance.now() : Date.now());
      var _buzz;
      var _rt;
      var _fxScene = new THREE.Scene();
      var _fxCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      var _fxMat = new THREE.ShaderMaterial({
        uniforms: {
          tDiffuse: { type: "t", value: null },
          amount: { type: "f", value: odds.fisheye },
          crt: { type: "f", value: odds.crt },
          vhs: { type: "f", value: odds.vhs },
          time: { type: "f", value: 0 },
          aspect: { type: "f", value: window.innerWidth / window.innerHeight },
          resolution: { type: "v2", value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
        },
        vertexShader: [
          "varying vec2 vUv;",
          "void main() {",
          "  vUv = uv;",
          "  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);",
          "}"
        ].join("\n"),
        fragmentShader: [
          "uniform sampler2D tDiffuse;",
          "uniform float amount;",
          "uniform float crt;",
          "uniform float vhs;",
          "uniform float time;",
          "uniform float aspect;",
          "uniform vec2 resolution;",
          "varying vec2 vUv;",
          "void main() {",
          "  vec2 p = vUv * 2.0 - 1.0;",
          "  p.x *= aspect;",
          "  float r = length(p);",
          "  float k = amount;",
          "  float r2 = r * r;",
          "  float srcR = r * (1.0 + k * 0.9 * r2 + k * k * 0.55 * r2 * r2);",
          "  vec2 q = p;",
          "  if (r > 0.00001) q *= srcR / r;",
          "  q.x /= aspect;",
          "  vec2 uvS = q * 0.5 + 0.5;",
          "  vec2 pc = uvS * 2.0 - 1.0;",
          "  pc *= 1.0 + crt * 0.14 * dot(pc, pc);",
          "  uvS = pc * 0.5 + 0.5;",
          "  float nLine = fract(sin((uvS.y * 931.0 + time * 2.4) * 12.9898) * 43758.5453);",
          "  float nSlow = fract(sin((uvS.y * 41.0 + time * 0.55) * 78.233) * 23421.631);",
          "  float hit = step(0.88, fract(sin(floor(time * 1.15) * 91.7) * 31337.1));",
          "  float bandY = fract(time * 0.08 + 0.17);",
          "  float trackBand = smoothstep(0.09, 0.0, abs(uvS.y - bandY));",
          "  float head = smoothstep(0.9, 1.0, uvS.y);",
          "  uvS.x += vhs * (0.01 * (nLine - 0.5) + 0.045 * trackBand * (nSlow - 0.5) + 0.07 * hit * trackBand * (nLine - 0.5) + 0.09 * head * (nLine - 0.5));",
          "  uvS.y += vhs * 0.005 * sin(time * 1.4 + uvS.y * 8.0);",
          "  uvS.x = fract(uvS.x + 1.0);",
          "  vec3 voidCol = vec3(0.05, 0.045, 0.03);",
          "  float disc = mix(1.0, smoothstep(1.06, 0.88, r / mix(2.2, 1.0, k)), k);",
          "  vec3 col = voidCol;",
          "  vec2 ca = vec2(crt * 0.0032 * (0.6 + r), 0.0);",
          "  if (uvS.x > 0.0 && uvS.x < 1.0 && uvS.y > 0.0 && uvS.y < 1.0) {",
          "    float cr = texture2D(tDiffuse, uvS + ca).r;",
          "    float cg = texture2D(tDiffuse, uvS).g;",
          "    float cb = texture2D(tDiffuse, uvS - ca).b;",
          "    col = vec3(cr, cg, cb);",
          "  }",
          "  float scan = 0.7 + 0.3 * sin(uvS.y * resolution.y * 3.14159265);",
          "  col *= mix(1.0, scan, crt * 0.82);",
          "  float mx = mod(gl_FragCoord.x, 3.0);",
          "  vec3 grille = mx < 1.0 ? vec3(1.18, 0.14, 0.14) : mx < 2.0 ? vec3(0.14, 1.14, 0.14) : vec3(0.16, 0.18, 1.2);",
          "  col *= mix(vec3(1.0), grille, crt * 0.42);",
          "  float vig = smoothstep(1.4, 0.32, r);",
          "  col *= mix(1.0, vig, crt * 0.5);",
          "  col *= 1.0 + crt * 0.028 * sin(time * 51.0);",
          "  float roll = abs(fract(uvS.y * 0.18 - time * 0.035) - 0.5);",
          "  col *= 1.0 - crt * 0.08 * (1.0 - smoothstep(0.0, 0.04, roll));",
          "  float grain = fract(sin(dot(uvS + time * 0.13, vec2(12.9898, 78.233))) * 43758.5453);",
          "  col += vhs * 0.09 * (grain - 0.5);",
          "  float drop = step(0.996 - vhs * 0.03, fract(sin(floor(uvS.y * resolution.y * 0.5) * 17.3 + floor(time * 11.0)) * 93133.1));",
          "  col = mix(col, vec3(0.12 + 0.7 * grain), drop * vhs);",
          "  col.r += vhs * trackBand * 0.14;",
          "  col.b -= vhs * trackBand * 0.08;",
          "  col = mix(col, vec3(grain * 0.35), head * vhs * (0.35 + 0.5 * nLine));",
          "  gl_FragColor = vec4(mix(voidCol, col, disc), 1.0);",
          "}"
        ].join("\n"),
        depthTest: false,
        depthWrite: false
      });
      _fxScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), _fxMat));
      function sizeRt() {
        if (_rt) _rt.dispose();
        _rt = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          format: THREE.RGBFormat
        });
        _fxMat.uniforms.tDiffuse.value = _rt;
        _fxMat.uniforms.aspect.value = window.innerWidth / window.innerHeight;
        _fxMat.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
      }
      _webgl.setSize(window.innerWidth, window.innerHeight);
      _webgl.setClearColor(0xb8a84a);
      sizeRt();
      document.getElementById("container").appendChild(_webgl.domElement);
      window.addEventListener("resize", function () {
        _cam.aspect = window.innerWidth / window.innerHeight;
        _cam.updateProjectionMatrix();
        _webgl.setSize(window.innerWidth, window.innerHeight);
        sizeRt();
      }, false);

      function carveRect(form, r0, c0, rh, cw) {
        for (var r = r0; r < r0 + rh && r < form.rows; r++) {
          for (var c = c0; c < c0 + cw && c < form.cols; c++) {
            if (r < form.rows - 1 && form.h[r]) form.h[r][c] = true;
            if (c < form.cols - 1 && form.v[c]) form.v[c][r] = true;
          }
        }
      }

      function openRooms(maze) {
        var form = maze.form;
        var halls = 5 + Math.floor(Math.random() * 2);
        for (var n = 0; n < halls; n++) {
          var rh = 6 + Math.floor(Math.random() * 5);
          var cw = 7 + Math.floor(Math.random() * 8);
          var r0 = 1 + Math.floor(Math.random() * Math.max(1, form.rows - rh - 1));
          var c0 = 1 + Math.floor(Math.random() * Math.max(1, form.cols - cw - 1));
          carveRect(form, r0, c0, rh, cw);
          if (Math.random() < 0.85) {
            var wingH = 3 + Math.floor(Math.random() * 5);
            var wingW = 3 + Math.floor(Math.random() * 5);
            if (Math.random() < 0.5) carveRect(form, r0, Math.max(1, c0 - 3), wingH, cw + wingW);
            else carveRect(form, Math.max(1, r0 - 3), c0, rh + wingH, wingW);
          }
        }
        for (var hr = 0; hr < form.h.length; hr++) {
          for (var hc = 0; hc < form.cols; hc++) {
            if (Math.random() < 0.42) form.h[hr][hc] = true;
            else if (Math.random() < 0.08) form.h[hr][hc] = null;
          }
        }
        for (var vc = 0; vc < form.v.length; vc++) {
          for (var vr = 0; vr < form.rows; vr++) {
            if (Math.random() < 0.42) form.v[vc][vr] = true;
            else if (Math.random() < 0.08) form.v[vc][vr] = null;
          }
        }
      }

      function wallSprite(w, h) {
        var mat = new THREE.MeshLambertMaterial({
          map: _wallMap,
          fog: true,
          side: THREE.DoubleSide
        });
        var mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
        mesh.scale.set(w, h, 1);
        mesh.userData.yawBillboard = true;
        return mesh;
      }

      function texSprite(draw, w, h) {
        var mat = new THREE.MeshLambertMaterial({
          map: canvasTex(function (g) {
            g.clearRect(0, 0, 64, 64);
            draw(g);
          }),
          transparent: true,
          depthWrite: false,
          fog: true,
          side: THREE.DoubleSide
        });
        var mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
        mesh.scale.set(w, h, 1);
        mesh.rotation.x = -Math.PI / 2;
        mesh.userData.yawBillboard = false;
        return mesh;
      }

      function paintHalfTile(g) {
        paintCeil(g);
        g.clearRect(32, 0, 32, 64);
      }

      function paintAskewTile(g) {
        g.fillStyle = "#d4ccb0";
        g.strokeStyle = "#b8b090";
        g.fillRect(4, 6, 28, 22);
        g.strokeRect(4, 6, 28, 22);
        g.beginPath(); g.moveTo(18, 6); g.lineTo(18, 28); g.stroke();
        g.save();
        g.translate(42, 42);
        g.rotate(0.55);
        g.fillRect(-16, -11, 32, 22);
        g.strokeRect(-16, -11, 32, 22);
        g.beginPath(); g.moveTo(0, -11); g.lineTo(0, 11); g.stroke();
        g.restore();
      }

      function pick(arr, n) {
        var copy = arr.slice();
        var out = [];
        while (out.length < n && copy.length) {
          out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
        }
        return out;
      }


      function pathSet(path) {
        var s = {};
        for (var i = 0; i < path.length; i++) s[path[i][0] + "," + path[i][1]] = true;
        return s;
      }

      function stripGoal(scene) {
        var doomed = [];
        scene.children.forEach(function (obj) {
          if (obj instanceof THREE.Sprite) doomed.push(obj);
        });
        doomed.forEach(function (obj) { scene.remove(obj); });
      }

      function inBay(x, z, bay) {
        return x >= bay.x0 && x <= bay.x1 && z >= bay.z0 && z <= bay.z1;
      }

      function dressSurfaces(scene, maze) {
        var col0 = 2 + Math.floor(Math.random() * Math.max(1, maze.form.cols - 8));
        var row0 = 2 + Math.floor(Math.random() * Math.max(1, maze.form.rows - 7));
        var bay = {
          x0: col0 * CELL - CELL,
          x1: (col0 + 5) * CELL,
          z0: row0 * CELL,
          z1: (row0 + 4) * CELL + CELL
        };
        var red = {
          x0: (2 + Math.floor(Math.random() * Math.max(1, maze.form.cols - 7))) * CELL,
          z0: (2 + Math.floor(Math.random() * Math.max(1, maze.form.rows - 6))) * CELL
        };
        red.x1 = red.x0 + 3 * CELL;
        red.z1 = red.z0 + 3 * CELL;
        var ceilings = _mazeRenderer.ceilingGroup.children;
        var floors = _mazeRenderer.floorGroup.children;
        var walls = _mazeRenderer.wallGroup.children;
        var lights = _mazeRenderer.lightGroup.children;
        var i;
        pick(ceilings, odds.missing).forEach(function (c) { c.material = _missingMat; });
        if (odds.bay) {
          pick(floors.filter(function (f) { return inBay(f.position.x, f.position.z, bay); }), odds.wet)
            .forEach(function (f) { f.material = _wetMat; });
        }
        if (odds.red) {
          for (i = 0; i < floors.length; i++) {
            if (inBay(floors[i].position.x, floors[i].position.z, red)) floors[i].material = _redFloorMat;
          }
        }
        _buzz = null;
        for (i = 0; i < lights.length; i++) {
          var light = lights[i];
          if (!(light instanceof THREE.PointLight)) continue;
          light.color.setHex(0xdde8b0);
          light.position.y = 2.1;
          light.distance = 16;
          if (odds.bay && inBay(light.position.x, light.position.z, bay)) {
            light.intensity = 0;
          } else if (odds.red && inBay(light.position.x, light.position.z, red)) {
            light.color.setHex(0xc06040);
            light.intensity = 0.35;
          } else {
            light.intensity = 0.48;
            if (!_buzz && Math.random() < 0.15) _buzz = light;
          }
        }
        var inner = [];
        var maxX = maze.form.cols * CELL;
        var maxZ = maze.form.rows * CELL;
        for (i = 0; i < walls.length; i++) {
          var w = walls[i];
          if (odds.red && inBay(w.position.x, w.position.z, red)) w.material = _redMat;
          if (w.position.x > CELL && w.position.x < maxX - CELL &&
              w.position.z > CELL && w.position.z < maxZ - CELL) {
            inner.push(w);
          }
        }
        pick(inner, odds.exit).forEach(function (w) { w.material = _exitMat; });
        pick(inner, odds.outlets).forEach(function (w) {
          if (w.material !== _exitMat && w.material !== _redMat) w.material = _outletMat;
        });
        var holes = ceilings.filter(function (c) { return c.material === _missingMat; });
        var tileSpots = holes.length ? holes : (odds.missing ? pick(ceilings, odds.missing) : []);
        tileSpots.forEach(function (c, idx) {
          var spr = texSprite(idx % 2 ? paintAskewTile : paintHalfTile, 2.4, 2.4);
          spr.position.set(c.position.x, 2.15, c.position.z);
          scene.add(spr);
          _sprites.push(spr);
        });
      }

      function placePillars(scene, maze) {
        var blocked = pathSet(maze.path);
        var want = 22 + Math.floor(Math.random() * 10);
        var tries = 0;
        var start = _sprites.length;
        while (_sprites.length < start + want && tries < 120) {
          tries++;
