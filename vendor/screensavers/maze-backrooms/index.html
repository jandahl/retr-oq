<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Backrooms</title>
    <style>
      html, body { margin: 0; overflow: hidden; background: #c4b44a; }
      #container { width: 100%; height: 100%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r71/three.min.js"></script>
    <script>
      function crunch(t) {
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.magFilter = t.minFilter = THREE.NearestFilter;
        t.generateMipmaps = false;
        return t;
      }
      THREE.ImageUtils = THREE.ImageUtils || {};
      THREE.ImageUtils.loadTexture = function (url) {
        var c = document.createElement("canvas");
        c.width = c.height = 64;
        var g = c.getContext("2d");
        var name = String(url);
        if (name.indexOf("floor") !== -1) {
          g.fillStyle = "#c2a63d";
          g.fillRect(0, 0, 64, 64);
          for (var i = 0; i < 220; i++) {
            g.fillStyle = i % 7 === 0 ? "#a88c32" : "#d4b84a";
            g.fillRect((i * 19) % 64, (i * 11) % 64, 2, 2);
          }
        } else if (name.indexOf("ceil") !== -1) {
          g.fillStyle = "#d8d0b0";
          g.fillRect(0, 0, 64, 64);
          g.strokeStyle = "#c8c09a";
          g.strokeRect(0.5, 0.5, 63, 63);
          g.beginPath();
          g.moveTo(32, 0); g.lineTo(32, 64);
          g.stroke();
          g.fillStyle = "#eee6c0";
          g.fillRect(10, 22, 44, 14);
          g.fillStyle = "#ffffff";
          g.globalAlpha = 0.35;
          g.fillRect(12, 24, 18, 5);
          g.fillRect(34, 24, 18, 5);
          g.globalAlpha = 1;
        } else {
          g.fillStyle = "#e5d35c";
          g.fillRect(0, 0, 64, 64);
          g.fillStyle = "#d8c44e";
          for (var x = 0; x < 64; x += 8) g.fillRect(x, 0, 3, 64);
          g.fillStyle = "#c4a83a";
          for (var s = 0; s < 8; s++) {
            g.globalAlpha = 0.25;
            g.beginPath();
            g.arc((s * 23) % 64, (s * 17) % 64, 4 + (s % 3), 0, Math.PI * 2);
            g.fill();
          }
          g.globalAlpha = 1;
        }
        var t = new THREE.Texture(c);
        t.needsUpdate = true;
        return crunch(t);
      };
    </script>
    <script src="https://cdn.jsdelivr.net/gh/jobbojobson/WebGLMaze@385d329bbe9f/js/maze.js"></script>
  </head>
  <body>
    <div id="container"></div>
    <script>
      var CELL = 5;
      var _cam = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.2, 36);
      var _webgl = new THREE.WebGLRenderer({ antialias: false });
      var _walker;
      var _mazeRenderer;
      var _sprites = [];
      var _buzz;
      _webgl.setSize(window.innerWidth, window.innerHeight);
      _webgl.setClearColor(0xb8a84a);
      document.getElementById("container").appendChild(_webgl.domElement);
      window.addEventListener("resize", function () {
        _cam.aspect = window.innerWidth / window.innerHeight;
        _cam.updateProjectionMatrix();
        _webgl.setSize(window.innerWidth, window.innerHeight);
      }, false);

      function carveRect(form, r0, c0, rh, cw) {
        for (var r = r0; r < r0 + rh && r < form.rows; r++) {
          for (var c = c0; c < c0 + cw && c < form.cols; c++) {
            if (r < form.rows - 1 && form.h[r]) form.h[r][c] = true;
            if (c < form.cols - 1 && form.v[c]) form.v[c][r] = true;
          }
        }
      }

      function openRooms(maze) {
        var form = maze.form;
        var halls = 5 + Math.floor(Math.random() * 2);
        for (var n = 0; n < halls; n++) {
          var rh = 6 + Math.floor(Math.random() * 5);
          var cw = 7 + Math.floor(Math.random() * 8);
          var r0 = 1 + Math.floor(Math.random() * Math.max(1, form.rows - rh - 1));
          var c0 = 1 + Math.floor(Math.random() * Math.max(1, form.cols - cw - 1));
          carveRect(form, r0, c0, rh, cw);
          if (Math.random() < 0.85) {
            var wingH = 3 + Math.floor(Math.random() * 5);
            var wingW = 3 + Math.floor(Math.random() * 5);
            if (Math.random() < 0.5) carveRect(form, r0, Math.max(1, c0 - 3), wingH, cw + wingW);
            else carveRect(form, Math.max(1, r0 - 3), c0, rh + wingH, wingW);
          }
        }
        for (var hr = 0; hr < form.h.length; hr++) {
          for (var hc = 0; hc < form.cols; hc++) {
            if (Math.random() < 0.42) form.h[hr][hc] = true;
            else if (Math.random() < 0.08) form.h[hr][hc] = null;
          }
        }
        for (var vc = 0; vc < form.v.length; vc++) {
          for (var vr = 0; vr < form.rows; vr++) {
            if (Math.random() < 0.42) form.v[vc][vr] = true;
            else if (Math.random() < 0.08) form.v[vc][vr] = null;
          }
        }
      }

      function texSprite(draw, w, h) {
        var c = document.createElement("canvas");
        c.width = 64;
        c.height = 64;
        var g = c.getContext("2d");
        g.clearRect(0, 0, 64, 64);
        draw(g);
        var t = new THREE.Texture(c);
        t.needsUpdate = true;
        crunch(t);
        var mat = new THREE.SpriteMaterial({ map: t, transparent: true, fog: true });
        var spr = new THREE.Sprite(mat);
        spr.scale.set(w, h, 1);
        return spr;
      }

      function drawPillar(g) {
        g.fillStyle = "#4a4018";
        g.fillRect(14, 0, 36, 64);
        g.fillStyle = "#e5d35c";
        g.fillRect(17, 3, 30, 58);
        g.fillStyle = "#d8c44e";
        for (var x = 20; x < 44; x += 7) g.fillRect(x, 3, 3, 58);
        g.fillStyle = "#c4a83a";
        g.globalAlpha = 0.35;
        g.beginPath(); g.arc(32, 22, 8, 0, Math.PI * 2); g.fill();
        g.globalAlpha = 1;
        g.fillStyle = "#8a7828";
        g.fillRect(14, 0, 36, 6);
        g.fillRect(14, 58, 36, 6);
      }

      function pathSet(path) {
        var s = {};
        for (var i = 0; i < path.length; i++) s[path[i][0] + "," + path[i][1]] = true;
        return s;
      }

      function stripGoal(scene) {
        var doomed = [];
        scene.children.forEach(function (obj) {
          if (obj instanceof THREE.Sprite) doomed.push(obj);
        });
        doomed.forEach(function (obj) { scene.remove(obj); });
      }

      function placePillars(scene, maze) {
        _sprites.forEach(function (p) { scene.remove(p); });
        _sprites = [];
        var blocked = pathSet(maze.path);
        var lights = _mazeRenderer.lightGroup.children;
        _buzz = null;
        for (var i = 0; i < lights.length; i++) {
          var light = lights[i];
          if (!(light instanceof THREE.PointLight)) continue;
          light.color.setHex(0xdde8b0);
          light.intensity = 0.48;
          light.distance = 16;
          light.position.y = 2.1;
        }
        if (lights.length) {
          _buzz = lights[Math.floor(Math.random() * lights.length)];
          if (!(_buzz instanceof THREE.PointLight)) _buzz = null;
        }
        var want = 22 + Math.floor(Math.random() * 10);
        var tries = 0;
        while (_sprites.length < want && tries < 120) {
          tries++;
          var row = 1 + Math.floor(Math.random() * (maze.form.rows - 2));
          var col = 1 + Math.floor(Math.random() * (maze.form.cols - 2));
          var onPath = blocked[row + "," + col];
          var ox = 0;
          var oz = 0;
          if (onPath) {
            ox = (Math.random() < 0.5 ? -1.7 : 1.7);
            oz = (Math.random() < 0.5 ? -1.7 : 1.7);
          } else {
            blocked[row + "," + col] = true;
          }
          var pillar = texSprite(drawPillar, 1.5, 4.7);
          pillar.position.set(col * CELL + ox, 0, row * CELL + CELL / 2 + oz);
          scene.add(pillar);
          _sprites.push(pillar);
        }
      }

      buildScene();
      requestAnimationFrame(render);
      animate();

      function buildScene() {
        var maze = new Maze(16, 22);
        openRooms(maze);
        _mazeRenderer = new MazeRenderer(maze, new THREE.Scene());
        var scene = _mazeRenderer.getScene();
        scene.fog = new THREE.Fog(0xc4b44a, 7, 34);
        scene.add(new THREE.AmbientLight(0x2a2814));
        stripGoal(scene);
        placePillars(scene, maze);
        _walker = new MazeWalker({
          cam: _cam,
          path: maze.path,
          cellWidth: CELL,
          stepSize: 0.075,
          turnSpeed: 0.06
        });
      }
      function render() {
        _webgl.render(_mazeRenderer.getScene(), _cam);
      }
      function animate() {
        if (_buzz) {
          if (Math.random() < 0.018) _buzz.intensity = 0.1;
          else if (_buzz.intensity < 0.48 && Math.random() < 0.07) _buzz.intensity = 0.48;
        }
        render();
        if (_walker.atGoal) {
          _mazeRenderer.resizeWalls(-0.01);
          if (!_mazeRenderer.wallsUp) buildScene();
        }
        _walker.advance();
        requestAnimationFrame(animate);
      }
    </script>
  </body>
</html>
