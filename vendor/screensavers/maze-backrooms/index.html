<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Backrooms</title>
    <style>
      html, body { margin: 0; overflow: hidden; background: #c4b44a; }
      #container { width: 100%; height: 100%; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r71/three.min.js"></script>
    <script>
      THREE.ImageUtils = THREE.ImageUtils || {};
      THREE.ImageUtils.loadTexture = function (url) {
        var c = document.createElement("canvas");
        c.width = c.height = 64;
        var g = c.getContext("2d");
        var name = String(url);
        if (name.indexOf("floor") !== -1) {
          g.fillStyle = "#c2a63d";
          g.fillRect(0, 0, 64, 64);
          for (var i = 0; i < 220; i++) {
            g.fillStyle = i % 7 === 0 ? "#a88c32" : "#d4b84a";
            g.fillRect((i * 19) % 64, (i * 11) % 64, 2, 2);
          }
        } else if (name.indexOf("ceil") !== -1) {
          g.fillStyle = "#d8d0b0";
          g.fillRect(0, 0, 64, 64);
          g.strokeStyle = "#b8b090";
          g.strokeRect(1, 1, 62, 62);
          g.fillStyle = "#c4b070";
          g.beginPath(); g.arc(18, 22, 10, 0, Math.PI * 2); g.fill();
          g.fillStyle = "#9a8040";
          g.beginPath(); g.arc(44, 48, 7, 0, Math.PI * 2); g.fill();
        } else if (name.indexOf("smiley") !== -1) {
          g.fillStyle = "#1a1810";
          g.fillRect(0, 0, 64, 64);
          g.fillStyle = "#e6d45a";
          g.fillRect(8, 4, 48, 8);
        } else {
          g.fillStyle = "#e5d35c";
          g.fillRect(0, 0, 64, 64);
          g.fillStyle = "#d8c44e";
          for (var x = 0; x < 64; x += 8) g.fillRect(x, 0, 3, 64);
          g.fillStyle = "#c4a83a";
          for (var s = 0; s < 8; s++) {
            g.globalAlpha = 0.25;
            g.beginPath();
            g.arc((s * 23) % 64, (s * 17) % 64, 4 + (s % 3), 0, Math.PI * 2);
            g.fill();
          }
          g.globalAlpha = 1;
        }
        var t = new THREE.Texture(c);
        t.needsUpdate = true;
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        return t;
      };
    </script>
    <script src="https://cdn.jsdelivr.net/gh/jobbojobson/WebGLMaze@385d329bbe9f/js/maze.js"></script>
  </head>
  <body>
    <div id="container"></div>
    <script>
      var CELL = 5;
      var _cam = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      var _webgl = new THREE.WebGLRenderer();
      var _walker;
      var _mazeRenderer;
      var _props = [];
      _webgl.setSize(window.innerWidth, window.innerHeight);
      _webgl.setClearColor(0xb8a84a);
      document.getElementById("container").appendChild(_webgl.domElement);
      window.addEventListener("resize", function () {
        _cam.aspect = window.innerWidth / window.innerHeight;
        _cam.updateProjectionMatrix();
        _webgl.setSize(window.innerWidth, window.innerHeight);
      }, false);

      function cellPos(row, col) {
        return {
          x: col * CELL,
          z: row * CELL + CELL / 2
        };
      }

      function openRooms(maze) {
        var form = maze.form;
        var rooms = 5 + Math.floor(Math.random() * 4);
        for (var n = 0; n < rooms; n++) {
          var r0 = 1 + Math.floor(Math.random() * Math.max(1, form.rows - 5));
          var c0 = 1 + Math.floor(Math.random() * Math.max(1, form.cols - 5));
          var rh = 2 + Math.floor(Math.random() * 3);
          var cw = 2 + Math.floor(Math.random() * 4);
          for (var r = r0; r < r0 + rh && r < form.rows; r++) {
            for (var c = c0; c < c0 + cw && c < form.cols; c++) {
              if (r < form.rows - 1 && form.h[r]) form.h[r][c] = true;
              if (c < form.cols - 1 && form.v[c]) form.v[c][r] = true;
            }
          }
        }
        for (var hr = 0; hr < form.h.length; hr++) {
          for (var hc = 0; hc < form.cols; hc++) {
            if (Math.random() < 0.18) form.h[hr][hc] = true;
          }
        }
        for (var vc = 0; vc < form.v.length; vc++) {
          for (var vr = 0; vr < form.rows; vr++) {
            if (Math.random() < 0.18) form.v[vc][vr] = true;
          }
        }
      }

      function texSprite(draw, w, h) {
        var c = document.createElement("canvas");
        c.width = 64;
        c.height = 64;
        var g = c.getContext("2d");
        g.clearRect(0, 0, 64, 64);
        draw(g);
        var t = new THREE.Texture(c);
        t.needsUpdate = true;
        var mat = new THREE.SpriteMaterial({ map: t, transparent: true, fog: true });
        var spr = new THREE.Sprite(mat);
        spr.scale.set(w || 1.8, h || 1.8, 1);
        return spr;
      }

      var PROP_DRAW = [
        function chair(g) {
          g.fillStyle = "#3a3a3a";
          g.fillRect(18, 28, 28, 22);
          g.fillStyle = "#2a2a2a";
          g.fillRect(16, 20, 32, 10);
          g.fillRect(20, 50, 6, 12);
          g.fillRect(38, 50, 6, 12);
        },
        function cart(g) {
          g.strokeStyle = "#6a6a6a";
          g.lineWidth = 3;
          g.strokeRect(14, 18, 36, 28);
          g.beginPath(); g.moveTo(14, 18); g.lineTo(8, 8); g.stroke();
          g.fillStyle = "#202020";
          g.beginPath(); g.arc(20, 52, 6, 0, Math.PI * 2); g.fill();
          g.beginPath(); g.arc(44, 52, 6, 0, Math.PI * 2); g.fill();
        },
        function plant(g) {
          g.fillStyle = "#8a5a2a";
          g.fillRect(24, 40, 16, 18);
          g.fillStyle = "#2a6a28";
          g.beginPath(); g.arc(32, 28, 16, 0, Math.PI * 2); g.fill();
          g.fillStyle = "#1e4a1c";
          g.fillRect(28, 12, 8, 16);
        },
        function cooler(g) {
          g.fillStyle = "#d8d8d8";
          g.fillRect(20, 28, 24, 30);
          g.fillStyle = "#7ec8e0";
          g.beginPath(); g.arc(32, 20, 14, 0, Math.PI * 2); g.fill();
          g.fillStyle = "#4a4a4a";
          g.fillRect(30, 44, 8, 8);
        },
        function crt(g) {
          g.fillStyle = "#2a2a2a";
          g.fillRect(12, 10, 40, 32);
          g.fillStyle = "#3a5a3a";
          g.fillRect(16, 14, 32, 24);
          g.fillStyle = "#c0c0c0";
          g.fillRect(18, 44, 28, 12);
        },
        function wet(g) {
          g.fillStyle = "#d4c400";
          g.beginPath();
          g.moveTo(32, 8); g.lineTo(56, 56); g.lineTo(8, 56); g.closePath();
          g.fill();
          g.fillStyle = "#202020";
          g.fillRect(30, 22, 4, 16);
          g.fillRect(30, 44, 4, 4);
        },
        function ladder(g) {
          g.strokeStyle = "#8a6a30";
          g.lineWidth = 4;
          g.beginPath(); g.moveTo(18, 8); g.lineTo(18, 56); g.stroke();
          g.beginPath(); g.moveTo(46, 8); g.lineTo(46, 56); g.stroke();
          g.lineWidth = 3;
          for (var y = 16; y < 52; y += 10) {
            g.beginPath(); g.moveTo(18, y); g.lineTo(46, y); g.stroke();
          }
        },
        function balloon(g) {
          g.fillStyle = "#c02020";
          g.beginPath(); g.arc(32, 24, 16, 0, Math.PI * 2); g.fill();
          g.strokeStyle = "#202020";
          g.beginPath(); g.moveTo(32, 40); g.lineTo(32, 60); g.stroke();
        },
        function box(g) {
          g.fillStyle = "#c4a060";
          g.fillRect(12, 24, 40, 28);
          g.fillStyle = "#a88848";
          g.fillRect(12, 20, 40, 8);
          g.strokeStyle = "#6a5020";
          g.strokeRect(12, 24, 40, 28);
        },
        function phone(g) {
          g.fillStyle = "#1a1a1a";
          g.fillRect(14, 28, 36, 20);
          g.fillRect(18, 16, 28, 10);
          g.fillStyle = "#d0d0d0";
          g.fillRect(22, 34, 6, 6);
          g.fillRect(32, 34, 6, 6);
          g.fillRect(42, 34, 6, 6);
        },
        function bin(g) {
          g.fillStyle = "#2a5a2a";
          g.fillRect(18, 16, 28, 40);
          g.fillStyle = "#1a3a1a";
          g.fillRect(16, 12, 32, 8);
        },
        function lamp(g) {
          g.fillStyle = "#e8e0c0";
          g.fillRect(10, 20, 44, 10);
          g.fillStyle = "#808080";
          g.fillRect(28, 30, 8, 26);
        }
      ];

      function scatterProps(scene, maze) {
        _props.forEach(function (p) { scene.remove(p); });
        _props = [];
        var count = 16 + Math.floor(Math.random() * 10);
        for (var i = 0; i < count; i++) {
          var draw = PROP_DRAW[Math.floor(Math.random() * PROP_DRAW.length)];
          var spr = texSprite(draw, 1.6 + Math.random(), 1.6 + Math.random());
          var row = Math.floor(Math.random() * maze.form.rows);
          var col = Math.floor(Math.random() * maze.form.cols);
          var p = cellPos(row, col);
          spr.position.set(p.x + (Math.random() - 0.5) * 2, 1.1, p.z + (Math.random() - 0.5) * 2);
          scene.add(spr);
          _props.push(spr);
        }
      }

      buildScene();
      requestAnimationFrame(render);
      animate();

      function buildScene() {
        var maze = new Maze(14, 18);
        openRooms(maze);
        _mazeRenderer = new MazeRenderer(maze, new THREE.Scene());
        var scene = _mazeRenderer.getScene();
        scene.fog = new THREE.FogExp2(0xc4b44a, 0.07);
        scatterProps(scene, maze);
        _walker = new MazeWalker({ cam: _cam, path: maze.path, cellWidth: CELL });
      }
      function render() {
        _webgl.render(_mazeRenderer.getScene(), _cam);
      }
      function animate() {
        if (Math.random() < 0.035) _webgl.setClearColor(0x6a6228);
        else _webgl.setClearColor(0xb8a84a);
        render();
        if (_walker.atGoal) {
          _mazeRenderer.resizeWalls(-0.01);
          if (!_mazeRenderer.wallsUp) buildScene();
        }
        _walker.advance();
        requestAnimationFrame(animate);
      }
    </script>
  </body>
</html>
