<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boing</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        position: fixed;
        background: #0055aa;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="c" aria-label="Boing ball"></canvas>
    <script>
      (function () {
        // Fullscreen idle of the 1984 checkered sphere. Palette + mesh match
        // amiga/app.js drawBoing (nLat 8 / nLon 10, #ee1111 / #ffffff quads,
        // rotX tilt, black rim, upper-left specular). Room is extra 12-bit OCS.
        const canvas = document.getElementById("c");
        const ctx = canvas.getContext("2d", { alpha: false });

        const RED = [238, 17, 17];
        const WHITE = [255, 255, 255];
        const N_LON = 10;
        const N_LAT = 8;
        const ROT_X = 0.35;

        const ROOM_HW = 6.6;
        const ROOM_H = 7.4;
        const Z_NEAR = 6.2;
        const Z_FAR = -12.4;
        const R = 1.85;
        const CAM = { x: 0, y: 3.15, z: 9.2 };

        const COL = {
          back: "#0055aa",
          side: "#002266",
          ceil: "#001144",
          floor: "#440044",
          grid: "#cc00aa",
          gridWall: "#3377bb",
          gridCeil: "#114477",
          orange: "#ff8800",
        };

        let W = 1;
        let H = 1;
        let fov = 1;
        let raf = 0;
        let last = 0;
        let reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        const ball = {
          x: 2.4,
          y: 5.1,
          z: -3.4,
          vx: 2.7,
          vy: 0,
          rotY: 0,
        };

        function quant12(n) {
          return Math.round(Math.max(0, Math.min(255, n)) / 17) * 17;
        }

        function rgb(r, g, b) {
          return "rgb(" + quant12(r) + "," + quant12(g) + "," + quant12(b) + ")";
        }

        function sph(theta, phi) {
          return {
            x: Math.sin(theta) * Math.cos(phi),
            y: Math.cos(theta),
            z: Math.sin(theta) * Math.sin(phi),
          };
        }

        function project(x, y, z) {
          const dx = x - CAM.x;
          const dy = y - CAM.y;
          const dz = z - CAM.z;
          const depth = -dz;
          if (depth < 0.12) return null;
          const s = fov / depth;
          return {
            x: W * 0.5 + dx * s,
            y: H * 0.36 - dy * s,
            depth: depth,
            s: s,
          };
        }

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = Math.max(1, window.innerWidth);
          H = Math.max(1, window.innerHeight);
          canvas.width = Math.round(W * dpr);
          canvas.height = Math.round(H * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          fov = 1.22 * Math.min(W, H);
        }

        function poly(pts, fill, stroke, width) {
          if (!pts || pts.length < 2) return;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.closePath();
          if (fill) {
            ctx.fillStyle = fill;
            ctx.fill();
          }
          if (stroke) {
            ctx.strokeStyle = stroke;
            ctx.lineWidth = width || 1.5;
            ctx.stroke();
          }
        }

        function corners(list) {
          const out = [];
          for (let i = 0; i < list.length; i++) {
            const p = project(list[i][0], list[i][1], list[i][2]);
            if (!p) return null;
            out.push(p);
          }
          return out;
        }

        function gridLines(drawSeg, color, width) {
          ctx.strokeStyle = color;
          ctx.lineWidth = width;
          ctx.beginPath();
          drawSeg();
          ctx.stroke();
        }

        function seg(ax, ay, az, bx, by, bz) {
          const a = project(ax, ay, az);
          const b = project(bx, by, bz);
          if (!a || !b) return;
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
        }

        function drawRoom() {
          ctx.fillStyle = COL.back;
          ctx.fillRect(0, 0, W, H);

          const hw = ROOM_HW;
          const h = ROOM_H;
          const zn = Z_NEAR;
          const zf = Z_FAR;

          poly(corners([[-hw, h, zn], [hw, h, zn], [hw, h, zf], [-hw, h, zf]]), COL.ceil);
          poly(corners([[-hw, 0, zf], [hw, 0, zf], [hw, h, zf], [-hw, h, zf]]), COL.back);
          poly(corners([[-hw, 0, zn], [-hw, 0, zf], [-hw, h, zf], [-hw, h, zn]]), COL.side);
          poly(corners([[hw, 0, zn], [hw, 0, zf], [hw, h, zf], [hw, h, zn]]), COL.side);
          poly(corners([[-hw, 0, zn], [hw, 0, zn], [hw, 0, zf], [-hw, 0, zf]]), COL.floor);

          gridLines(function () {
            const nx = 12;
            const nz = 14;
            for (let i = 0; i <= nx; i++) {
              const x = -hw + (2 * hw * i) / nx;
              seg(x, 0, zn, x, 0, zf);
            }
            for (let j = 0; j <= nz; j++) {
              const z = zn + (zf - zn) * (j / nz);
              seg(-hw, 0, z, hw, 0, z);
            }
          }, COL.grid, Math.max(1.25, Math.min(W, H) / 480));

          gridLines(function () {
            for (let i = 0; i <= 8; i++) {
              const x = -hw + (2 * hw * i) / 8;
              seg(x, 0, zf, x, h, zf);
            }
            for (let j = 1; j <= 5; j++) {
              const y = (h * j) / 6;
              seg(-hw, y, zf, hw, y, zf);
            }
          }, COL.gridWall, 1.15);

          gridLines(function () {
            for (let i = 1; i <= 5; i++) {
              const y = (h * i) / 6;
              seg(-hw, y, zn, -hw, y, zf);
              seg(hw, y, zn, hw, y, zf);
            }
            for (let j = 1; j < 14; j += 2) {
              const z = zn + (zf - zn) * (j / 14);
              seg(-hw, 0, z, -hw, h, z);
              seg(hw, 0, z, hw, h, z);
            }
          }, COL.gridCeil, 1);

          gridLines(function () {
            for (let i = 0; i <= 8; i++) {
              const x = -hw + (2 * hw * i) / 8;
              seg(x, h, zn, x, h, zf);
            }
            for (let j = 0; j <= 10; j++) {
              const z = zn + (zf - zn) * (j / 10);
              seg(-hw, h, z, hw, h, z);
            }
          }, COL.gridCeil, 1);

          // Kickstart orange kick plate along the back wall / floor seam.
          poly(
            corners([
              [-hw, 0, zf],
              [hw, 0, zf],
              [hw, 0.16, zf],
              [-hw, 0.16, zf],
            ]),
            COL.orange
          );
        }

        function drawShadow(bx, by, bz, squash) {
          const lift = Math.max(0, by - R);
          const rx = R * 0.78 * (1 + lift * 0.06);
          const rz = R * 0.42 * (1 + lift * 0.08);
          const pts = [];
          const n = 28;
          for (let i = 0; i < n; i++) {
            const a = (i / n) * Math.PI * 2;
            const p = project(bx + Math.cos(a) * rx, 0.02, bz + Math.sin(a) * rz);
            if (!p) return;
            pts.push(p);
          }
          const near = Math.max(0, 1 - lift / 3.2);
          ctx.fillStyle = "rgba(0,0,0," + (0.16 + 0.28 * near).toFixed(3) + ")";
          poly(pts, ctx.fillStyle);
        }

        function drawBoing(bx, by, bz, rotY, squash) {
          const nLon = N_LON;
          const nLat = N_LAT;
          const quads = [];
          const cosX = Math.cos(ROT_X);
          const sinX = Math.sin(ROT_X);
          const yDrop = (1 - squash) * R;

          for (let i = 0; i < nLat; i++) {
            const theta0 = (i / nLat) * Math.PI;
            const theta1 = ((i + 1) / nLat) * Math.PI;
            for (let j = 0; j < nLon; j++) {
              const phi0 = (j / nLon) * Math.PI * 2 + rotY;
              const phi1 = ((j + 1) / nLon) * Math.PI * 2 + rotY;
              const pts = [sph(theta0, phi0), sph(theta0, phi1), sph(theta1, phi1), sph(theta1, phi0)];
              const local = pts.map(function (p) {
                const y = p.y * cosX - p.z * sinX;
                const z = p.y * sinX + p.z * cosX;
                return { x: p.x, y: y, z: z };
              });
              const zMid = (local[0].z + local[1].z + local[2].z + local[3].z) / 4;
              if (zMid < 0) continue;
              const proj = [];
              let ok = true;
              for (let k = 0; k < 4; k++) {
                const p = local[k];
                const wy = by + p.y * R * squash + yDrop;
                const scr = project(bx + p.x * R, wy, bz + p.z * R);
                if (!scr) {
                  ok = false;
                  break;
                }
                proj.push(scr);
              }
              if (!ok) continue;
              const lit = 0.82 + 0.18 * Math.max(0, Math.min(1, zMid));
              const base = (i + j) % 2 === 0 ? RED : WHITE;
              quads.push({
                proj: proj,
                z: zMid,
                color: rgb(base[0] * lit, base[1] * lit, base[2] * lit),
              });
            }
          }
          quads.sort(function (a, b) { return a.z - b.z; });
          for (let q = 0; q < quads.length; q++) {
            poly(quads[q].proj, quads[q].color);
          }

          const c = project(bx, by + yDrop, bz);
          if (!c) return;
          const rim = project(bx + R, by + yDrop, bz);
          if (!rim) return;
          const rad = Math.abs(rim.x - c.x);
          ctx.beginPath();
          ctx.ellipse(c.x, c.y, rad, rad * squash, 0, 0, Math.PI * 2);
          ctx.strokeStyle = "#000000";
          ctx.lineWidth = Math.max(2, rad * (2 / 36));
          ctx.stroke();

          ctx.fillStyle = "rgba(255,255,255,0.28)";
          ctx.beginPath();
          ctx.ellipse(
            c.x - rad * 0.28,
            c.y - rad * squash * 0.32,
            rad * 0.22,
            rad * squash * 0.14,
            -0.5,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }

        function step(dt, t) {
          const minX = -(ROOM_HW - R - 0.2);
          const maxX = ROOM_HW - R - 0.2;
          const minY = R;
          const maxY = ROOM_H - R - 0.15;

          if (reduceMotion) {
            ball.x = Math.sin(t * 0.32) * 1.15;
            ball.y = minY + 1.05 + Math.sin(t * 1.25) * 0.42;
            ball.vx = Math.cos(t * 0.32) * 0.35;
            ball.rotY += 0.55 * dt * (ball.vx >= 0 ? 1 : -1);
            const near = Math.max(0, 1 - (ball.y - minY) / (R * 1.4));
            return 1 - near * 0.06;
          }

          ball.vy -= 22 * dt;
          ball.x += ball.vx * dt;
          ball.y += ball.vy * dt;
          if (ball.x < minX) {
            ball.x = minX;
            ball.vx = Math.abs(ball.vx);
          }
          if (ball.x > maxX) {
            ball.x = maxX;
            ball.vx = -Math.abs(ball.vx);
          }
          if (ball.y > maxY) {
            ball.y = maxY;
            ball.vy = -Math.abs(ball.vy) * 0.4;
          }
          if (ball.y < minY) {
            ball.y = minY;
            ball.vy = -Math.max(Math.abs(ball.vy) * 0.92, 9.2);
          }
          ball.rotY += 2.55 * dt * (ball.vx >= 0 ? 1 : -1);

          const near = Math.max(0, 1 - (ball.y - minY) / (R * 0.85));
          return 1 - near * 0.18;
        }

        function frame(now) {
          raf = 0;
          if (document.hidden) return;
          if (!last) last = now;
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          const squash = step(dt, now / 1000);
          drawRoom();
          drawShadow(ball.x, ball.y, ball.z, squash);
          drawBoing(ball.x, ball.y, ball.z, ball.rotY, squash);
          raf = requestAnimationFrame(frame);
        }

        function play() {
          if (document.hidden) return;
          last = 0;
          if (!raf) raf = requestAnimationFrame(frame);
        }

        function pause() {
          if (raf) cancelAnimationFrame(raf);
          raf = 0;
        }

        window.addEventListener("resize", function () {
          resize();
          if (document.hidden) {
            drawRoom();
            drawShadow(ball.x, ball.y, ball.z, 1);
            drawBoing(ball.x, ball.y, ball.z, ball.rotY, 1);
          }
        });
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) pause();
          else play();
        });
        const motion = window.matchMedia("(prefers-reduced-motion: reduce)");
        if (motion.addEventListener) {
          motion.addEventListener("change", function (e) {
            reduceMotion = e.matches;
          });
        } else if (motion.addListener) {
          motion.addListener(function (e) {
            reduceMotion = e.matches;
          });
        }

        resize();
        play();
      })();
    </script>
    <script src="../../../shared/redmond/ss-exit.js?v=3"></script>
  </body>
</html>
