<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>retr-oq — Windows 3.1 Program Manager</title>
<link rel="stylesheet" href="style.css?v=14" />
<link rel="stylesheet" href="ss.css?v=1" />
</head>
<body>
  <section class="boot-screen" id="boot-screen" aria-label="Windows 3.1 startup" aria-live="polite">
    <div class="boot-panel">
      <div class="boot-mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="boot-title">WINDOWS</div>
      <div class="boot-subtitle">hypertext UI computing</div>
      <div class="boot-version">Version 3.1</div>
      <div class="boot-status">Starting Program Manager...</div>
    </div>
  </section>
  <div class="desktop" id="desktop">

    <section class="window win31-window" id="win-progman" data-icon="progman" style="top: 1.5rem; left: 1.5rem; width: 22rem; height: 16rem;">
      <div class="title-bar">
        <button type="button" class="win-sysmenu" aria-label="Control-menu"></button>
        <div class="title-bar-text">Program Manager</div>
        <div class="title-bar-controls">
          <button type="button" aria-label="Minimize" class="win-minimize"></button>
          <button type="button" aria-label="Maximize" class="win-maximize"></button>
        </div>
      </div>
      <div class="window-body" style="display:flex;flex-direction:column;overflow:hidden;padding:0 2px 4px;">
        <ul class="menubar" id="progman-menubar">
          <li class="menu-root">
            <button type="button">File</button>
            <ul class="menu-drop" hidden>
              <li><button type="button" disabled>New...</button></li>
              <li><button type="button" disabled>Open</button></li>
              <li><button type="button" disabled>Move</button></li>
              <li><button type="button" disabled>Copy</button></li>
              <li><button type="button" disabled>Delete</button></li>
              <li><button type="button" disabled>Properties</button></li>
              <li class="divider"></li>
              <li><button type="button" disabled>Run...</button></li>
              <li class="divider"></li>
              <li><button type="button" id="menu-exit">Exit Windows...</button></li>
            </ul>
          </li>
          <li class="menu-root">
            <button type="button">Options</button>
            <ul class="menu-drop" hidden>
              <li><button type="button" disabled>Auto Arrange</button></li>
              <li><button type="button" id="menu-min-on-use">Minimize on Use</button></li>
              <li><button type="button" disabled>Save Settings on Exit</button></li>
            </ul>
          </li>
          <li class="menu-root">
            <button type="button">Window</button>
            <ul class="menu-drop" hidden>
              <li><button type="button" id="menu-cascade">Cascade</button></li>
              <li><button type="button" id="menu-tile">Tile</button></li>
              <li><button type="button" disabled>Arrange Icons</button></li>
            </ul>
          </li>
          <li class="menu-root">
            <button type="button">Help</button>
            <ul class="menu-drop" hidden>
              <li><button type="button" disabled>Contents</button></li>
              <li><button type="button" disabled>Search for Help on...</button></li>
              <li><button type="button" disabled>How to Use Help</button></li>
              <li class="divider"></li>
              <li><button type="button" id="menu-about">About Program Manager...</button></li>
            </ul>
          </li>
        </ul>
        <div class="group-icons">
          <button type="button" class="prog-icon" data-open="win-group-main">
            <span class="prog-icon-glyph icon-group" aria-hidden="true"></span>
            <span class="prog-icon-label">Main</span>
          </button>
          <button type="button" class="prog-icon" data-open="win-group-acc">
            <span class="prog-icon-glyph icon-group" aria-hidden="true"></span>
            <span class="prog-icon-label">Accessories</span>
          </button>
          <button type="button" class="prog-icon" data-open="win-group-games">
            <span class="prog-icon-glyph icon-group" aria-hidden="true"></span>
            <span class="prog-icon-label">Games</span>
          </button>
        </div>
      </div>
      <ul class="sysmenu" hidden>
        <li><button type="button" class="sysmenu-restore" disabled>Restore</button></li>
        <li><button type="button" disabled>Move</button></li>
        <li><button type="button" disabled>Size</button></li>
        <li><button type="button" class="sysmenu-min">Minimize</button></li>
        <li><button type="button" class="sysmenu-max">Maximize</button></li>
        <li class="sysmenu-divider"></li>
        <li><button type="button" class="win-close">Close</button></li>
      </ul>
      <div class="win31-resize-handle win31-resize-n" data-dir="n"></div>
      <div class="win31-resize-handle win31-resize-s" data-dir="s"></div>
      <div class="win31-resize-handle win31-resize-e" data-dir="e"></div>
      <div class="win31-resize-handle win31-resize-w" data-dir="w"></div>
      <div class="win31-resize-handle win31-resize-ne" data-dir="ne"></div>
      <div class="win31-resize-handle win31-resize-nw" data-dir="nw"></div>
      <div class="win31-resize-handle win31-resize-se" data-dir="se"></div>
      <div class="win31-resize-handle win31-resize-sw" data-dir="sw"></div>
    </section>

    <section class="window win31-window" id="win-group-main" data-icon="group" style="top: 3.5rem; left: 10rem; width: 18rem; height: 12rem;">
      <div class="title-bar">
        <button type="button" class="win-sysmenu" aria-label="Control-menu"></button>
        <div class="title-bar-text">Main</div>
        <div class="title-bar-controls">
          <button type="button" aria-label="Minimize" class="win-minimize"></button>
          <button type="button" aria-label="Maximize" class="win-maximize"></button>
        </div>
      </div>
      <div class="window-body" style="padding:4px;">
        <div class="group-icons">
          <button type="button" class="prog-icon" data-open="win-oq">
            <span class="prog-icon-glyph icon-oq" aria-hidden="true"></span>
            <span class="prog-icon-label">OQ!</span>
          </button>
          <button type="button" class="prog-icon" data-open="win-decon">
            <span class="prog-icon-glyph icon-decon" aria-hidden="true"></span>
            <span class="prog-icon-label">DECON</span>
          </button>
        </div>
      </div>
      <ul class="sysmenu" hidden>
        <li><button type="button" class="sysmenu-restore" disabled>Restore</button></li>
        <li><button type="button" disabled>Move</button></li>
        <li><button type="button" disabled>Size</button></li>
        <li><button type="button" class="sysmenu-min">Minimize</button></li>
        <li><button type="button" class="sysmenu-max">Maximize</button></li>
        <li class="sysmenu-divider"></li>
        <li><button type="button" class="win-close">Close</button></li>
      </ul>
      <div class="win31-resize-handle win31-resize-n" data-dir="n"></div>
      <div class="win31-resize-handle win31-resize-s" data-dir="s"></div>
      <div class="win31-resize-handle win31-resize-e" data-dir="e"></div>
      <div class="win31-resize-handle win31-resize-w" data-dir="w"></div>
      <div class="win31-resize-handle win31-resize-ne" data-dir="ne"></div>
      <div class="win31-resize-handle win31-resize-nw" data-dir="nw"></div>
      <div class="win31-resize-handle win31-resize-se" data-dir="se"></div>
      <div class="win31-resize-handle win31-resize-sw" data-dir="sw"></div>
    </section>

    <section class="window win31-window" id="win-group-acc" data-icon="group" style="top: 5rem; left: 12rem; width: 20rem; height: 13rem;">
      <div class="title-bar">
        <button type="button" class="win-sysmenu" aria-label="Control-menu"></button>
        <div class="title-bar-text">Accessories</div>
        <div class="title-bar-controls">
          <button type="button" aria-label="Minimize" class="win-minimize"></button>
          <button type="button" aria-label="Maximize" class="win-maximize"></button>
        </div>
      </div>
      <div class="window-body" style="padding:4px;">
        <div class="group-icons">
          <button type="button" class="prog-icon" data-open="win-clock">
            <span class="prog-icon-glyph icon-clock" aria-hidden="true"></span>
            <span class="prog-icon-label">Clock</span>
          </button>
          <button type="button" class="prog-icon" id="acc-ss">
            <span class="prog-icon-glyph icon-ss" aria-hidden="true"></span>
            <span class="prog-icon-label">Flying Windows</span>
          </button>
          <button type="button" class="prog-icon" id="acc-about">
            <span class="prog-icon-glyph icon-about" aria-hidden="true"></span>
            <span class="prog-icon-label">About retr-oq</span>
          </button>
        </div>
      </div>
      <ul class="sysmenu" hidden>
        <li><button type="button" class="sysmenu-restore" disabled>Restore</button></li>
        <li><button type="button" disabled>Move</button></li>
        <li><button type="button" disabled>Size</button></li>
        <li><button type="button" class="sysmenu-min">Minimize</button></li>
        <li><button type="button" class="sysmenu-max">Maximize</button></li>
        <li class="sysmenu-divider"></li>
        <li><button type="button" class="win-close">Close</button></li>
      </ul>
      <div class="win31-resize-handle win31-resize-n" data-dir="n"></div>
      <div class="win31-resize-handle win31-resize-s" data-dir="s"></div>
      <div class="win31-resize-handle win31-resize-e" data-dir="e"></div>
      <div class="win31-resize-handle win31-resize-w" data-dir="w"></div>
      <div class="win31-resize-handle win31-resize-ne" data-dir="ne"></div>
      <div class="win31-resize-handle win31-resize-nw" data-dir="nw"></div>
      <div class="win31-resize-handle win31-resize-se" data-dir="se"></div>
      <div class="win31-resize-handle win31-resize-sw" data-dir="sw"></div>
    </section>
