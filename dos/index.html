<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>retr-oq — DOS desktop prototype</title>
<link rel="stylesheet" href="../vendor/dos/css/bootstrap.min.css" />
<!-- ?v= is real cache-busting, unlike the no-cache meta tags mac1984/
     carries (those only ever addressed the HTML document itself, and only
     nominally even there -- see mac1984/index.html's own comment on them).
     A stale style.css/app.js served from a phone's cache while the HTML
     loads fresh is exactly the failure mode that broke this page after
     the last deploy: markup referencing classes/behavior a cached
     stylesheet/script didn't have yet. Bump the number whenever either
     file actually changes. -->
<link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <!-- DOS was single-tasking: no desktop, no icons, a program took the
       whole screen and exiting returned you to whatever launched it. This
       is that -- a `dir` listing, the actual home screen, not a desktop
       with icons on it. Only DICT.EXE is a real program below; BUILD.EXE
       and DECON.EXE are listed (the directory doesn't lie) but plain text,
       not buttons -- there is nothing to launch yet. -->
  <div class="dos-dir" id="dos-dir">
B:\OQ&gt;dir

 Volume in drive B is OQ
 Directory of B:\OQ

<button type="button" class="dos-link" id="launch-dict">DICT     EXE</button>        41,472  03-14-89   2:15p
BUILD    EXE        38,912  03-14-89   2:15p
DECON    EXE        35,328  03-14-89   2:15p
        3 File(s)      115,712 bytes
                     1,458,176 bytes free

B:\OQ&gt;<span class="dos-cursor">_</span></div>

  <!-- DICT.EXE: a full-screen takeover, not a floating window -- same
       reasoning as dos-dir above. Esc returns to the dir listing, the same
       way exiting a real DOS program dropped you back at the prompt. -->
  <div class="dos-app" id="dict-app" hidden>
    <div class="dos-app-header">B:\OQ\DICT.EXE</div>
    <div class="dos-app-body">
      <input type="text" class="form-control" id="dict-filter" placeholder="Filter..." autocomplete="off" />
      <p class="dos-app-status" id="dict-status"></p>
      <table class="table" id="dict-table">
        <thead>
          <tr><th>Lexeme</th><th>Translation</th></tr>
        </thead>
        <tbody id="dict-tbody"></tbody>
      </table>
      <!-- Filled in by app.js from shared/dict-source.js's DICT_ATTRIBUTION
           -- CC-BY-SA 4.0 requires this exact string wherever the data is
           shown (see docs/SOURCES.md in jandahl/oq); kept in one place
           there instead of copied into every consuming theme's markup. -->
      <p class="dos-app-attribution" id="dict-attribution"></p>
    </div>
    <button type="button" class="dos-app-footer" id="dict-exit">Esc=Exit to B:\OQ&gt;</button>
  </div>

<script type="module" src="app.js?v=4"></script>
</body>
</html>
