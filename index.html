<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>retr-oq</title>
<style>
  :root {
    --bg: #141210;
    --bg-elev: #1c1916;
    --fg: #f3eee4;
    --fg-muted: #9a9286;
    --fg-subtle: #6e675c;
    --ring: color-mix(in oklab, var(--fg) 55%, transparent);
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --icon: 96px;
    --motion-quick: 150ms;
    --motion-fast: 250ms;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--fg);
  }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    padding: var(--space-6) var(--space-4);
    padding-bottom: calc(var(--space-7) + env(safe-area-inset-bottom));
  }

  main {
    max-width: 52rem;
    margin: 0 auto;
  }

  header {
    margin-bottom: var(--space-6);
  }

  h1 {
    margin: 0;
    font-size: clamp(1.75rem, 1.2rem + 2vw, 2.5rem);
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }

  .lede {
    margin: var(--space-2) 0 0;
    color: var(--fg-muted);
    font-size: 1rem;
    line-height: 1.5;
    max-width: 36rem;
  }

  .shelf {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
    gap: var(--space-5) var(--space-3);
  }

  .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-3) var(--space-2);
    color: inherit;
    text-decoration: none;
    min-height: 44px;
    border-radius: 12px;
    outline: none;
    transition: transform var(--motion-fast) var(--ease-out);
  }

  .tile:hover,
  .tile:focus-visible {
    transform: translateY(-3px);
  }

  .tile:focus-visible .icon {
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ring);
  }

  .icon {
    width: var(--icon);
    height: var(--icon);
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: var(--bg-elev);
    overflow: hidden;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .icon svg {
    width: 64px;
    height: 64px;
    display: block;
    shape-rendering: crispEdges;
  }

  .name {
    font-size: 0.875rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-align: center;
    line-height: 1.25;
  }

  .year {
    font-size: 0.6875rem;
    font-variant-numeric: tabular-nums;
    color: var(--fg-muted);
    letter-spacing: 0.06em;
    text-align: center;
    line-height: 1.2;
  }

  .meta {
    font-size: 0.75rem;
    color: var(--fg-subtle);
    text-align: center;
    line-height: 1.3;
  }

  footer {
    margin-top: var(--space-7);
    color: var(--fg-subtle);
    font-size: 0.8125rem;
    line-height: 1.5;
  }

  footer a {
    color: var(--fg-muted);
  }

  .blink {
    animation: blink 1.1s steps(1, end) infinite;
  }

  .pulse {
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  @keyframes pulse {
    50% { opacity: 0.35; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
    .tile:hover, .tile:focus-visible { transform: none; }
    .blink, .pulse { animation: none; }
  }

  /* --boot-duration is set from hub.js's BOOT_SCREEN_MS -- the fade here
     and the JS timeout that reveals the hub share that one number. */
  #boot-screen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    transition: opacity var(--boot-duration, 0ms) var(--ease-out);
  }

  #boot-screen.boot-screen--done {
    opacity: 0;
    pointer-events: none;
  }

  #boot-screen .boot-text {
    font-size: 1rem;
    color: var(--fg-muted);
    letter-spacing: 0.02em;
  }

  #hub-main {
    opacity: 0;
  }

  #hub-main.hub-main--ready {
    opacity: 1;
    transition: opacity var(--boot-duration, 0ms) var(--ease-out);
  }

  .no-js #boot-screen {
    display: none;
  }

  .no-js #hub-main {
    opacity: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    #boot-screen, #hub-main { transition: none; }
  }
</style>
</head>
<body class="no-js">
  <div id="boot-screen">
    <p class="boot-text">retr-oq<span class="blink">_</span></p>
  </div>

  <main id="hub-main">
    <header>
      <h1>retr-oq</h1>
      <p class="lede">Retro desktops and consoles. Pick a machine.</p>
    </header>

    <ul class="shelf"></ul>

    <noscript>
      <p class="lede">
        JavaScript is off, so the icon tiles above didn't render. Pick a
        machine below instead:
      </p>
      <ul>
        <li><a href="dos/">DOS (1981)</a></li>
        <li><a href="c64/">Commodore 64 (1982)</a></li>
        <li><a href="mac1984/">Mac (1984)</a></li>
        <li><a href="nes/">NES (1985)</a></li>
        <li><a href="amiga/">Amiga (1988)</a></li>
        <li><a href="gb/">Game Boy (1989)</a></li>
        <li><a href="gg/">Game Gear (1990)</a></li>
        <li><a href="snes/">Super Nintendo (1991)</a></li>
        <li><a href="win31/">Windows 3.1 (1992)</a></li>
        <li><a href="next/">NeXT (1995)</a></li>
        <li><a href="mac8/">Mac OS 8.1 (1998)</a></li>
        <li><a href="win98/">Windows 98 (1998)</a></li>
        <li><a href="xp/">Windows XP (2001)</a></li>
        <li><a href="kde/">KDE (2006)</a></li>
        <li><a href="win7/">Windows 7 (2009)</a></li>
      </ul>
    </noscript>

    <footer>
      Fifteen skins for the same dictionary. See the
      <a href="https://github.com/jandahl/retr-oq">README</a>
      for how this relates to
      <a href="https://github.com/jandahl/oq">oq</a>.
    </footer>
  </main>

  <script>document.body.classList.remove("no-js");</script>
  <script src="hub-data.js?v=1"></script>
  <script src="hub.js?v=1"></script>
</body>
</html>
