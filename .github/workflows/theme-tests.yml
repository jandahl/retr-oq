name: theme tests

# One workflow, not five copy-pasted ones -- gb-tests.yml, gg-tests.yml,
# nes-tests.yml, snes-tests.yml, and win98-tests.yml were identical apart
# from which theme/paths/test file they named, which is exactly the kind
# of drift CLAUDE.md warns about for cache-bust versions ("stale JS next to
# fresh HTML is a real shipped bug") -- the same risk applies to stale
# workflow copies: win98-tests.yml had drifted to `pytest tests/ -v` (the
# WHOLE suite) instead of just tests/test_win98.py, silently masked because
# it still passed. Add a new console/desktop theme's own test suite here by
# adding its own block to the `filters:` section below (its name becomes
# both the matrix entry and the pytest file it runs, tests/test_<name>.py)
# -- no new workflow file, no new job to copy.
#
# The `changes` job computes which themes' paths actually changed so an
# unrelated PR (say, kde/ or docs) doesn't spin up five browser jobs for
# nothing; the `test` job's matrix then only runs for themes that changed.
on:
  push:
    branches: [master]
  pull_request: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    # `changes` (not per-filter outputs.<name>) is dorny/paths-filter's own
    # "which filters matched" JSON array -- e.g. '["gb","win98"]' -- built
    # for exactly this: feeding a matrix so it's SIZED to just the changed
    # themes. The alternative (a fixed 5-item matrix gated by a job-level
    # `if: needs.changes.outputs[matrix.theme] == 'true'`) looks reasonable
    # but is invalid: `matrix` isn't in the context GitHub allows inside
    # `jobs.<job_id>.if` (only `strategy`/`runs-on`/`steps` can see it) --
    # that mistake made the very first version of this file fail to parse
    # at all (zero jobs scheduled, no code ever ran).
    outputs:
      themes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gb:
              - "gb/**"
              - "vendor/nes/fonts/**"
              - "tests/test_gb.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"
            gg:
              - "gg/**"
              - "vendor/nes/fonts/**"
              - "tests/test_gg.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"
            nes:
              - "nes/**"
              - "vendor/nes/**"
              - "tests/test_nes.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"
            snes:
              - "snes/**"
              - "vendor/nes/fonts/**"
              - "vendor/next/fonts/**"
              - "tests/test_snes.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"
            win98:
              - "win98/**"
              - "vendor/win98/**"
              - "tests/test_win98.py"
              - "tests/conftest.py"
              - "tests/requirements.txt"

  test:
    needs: changes
    if: needs.changes.outputs.themes != '[]'
    strategy:
      fail-fast: false
      matrix:
        theme: ${{ fromJSON(needs.changes.outputs.themes) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # Retried: --with-deps runs apt-get update/install under the hood, and
      # Google's own Chrome apt repo has been observed serving a stale/
      # mismatched Packages.gz mid-mirror-sync ("Hash Sum mismatch"), which
      # fails apt before Playwright ever gets to installing the browser
      # itself -- nothing wrong with this repo's code, just a transient
      # upstream mirror hiccup. Three attempts with a short backoff clears
      # it without needing a human to notice and click "Re-run failed jobs".
      - name: Install Playwright's Chromium
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: playwright install --with-deps chromium

      - name: Run ${{ matrix.theme }} test suite
        run: python3 -m pytest tests/test_${{ matrix.theme }}.py -v
