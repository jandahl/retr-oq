name: mac1984 CI

# Manual only: this checks the mac1984/ prototype in isolation and is not
# meant to run on every push/PR to the whole repo (other theme directories
# have nothing to do with mac1984, and there's no build step here worth
# gating merges on yet). Trigger it by hand from the Actions tab, or via
# `gh workflow run mac1984-ci.yml`, when you've touched mac1984/ or
# vendor/mac1984/ and want it checked.
on:
  workflow_dispatch: {}

jobs:
  validate:
    name: Validate mac1984/index.html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HTML validate
        run: npx --yes html-validate mac1984/index.html

      - name: Check for broken local asset links
        run: |
          python3 -m http.server 8080 &
          server_pid=$!
          npx --yes wait-on http://localhost:8080/mac1984/index.html
          npx --yes linkinator http://localhost:8080/mac1984/index.html --recurse false
          kill "$server_pid"
