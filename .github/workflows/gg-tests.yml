name: gg tests

# Scoped to gg/ the same way gb-tests.yml is scoped to gb/ -- this
# repo has no shared build step between themes, so a pixel change in
# mac1984/ has nothing to break here.
on:
  push:
    branches: [master]
    paths:
      - "gg/**"
      - "vendor/nes/fonts/**"
      - "tests/test_gg.py"
      - "tests/conftest.py"
      - "tests/requirements.txt"
      - ".github/workflows/gg-tests.yml"
  pull_request:
    paths:
      - "gg/**"
      - "vendor/nes/fonts/**"
      - "tests/test_gg.py"
      - "tests/conftest.py"
      - "tests/requirements.txt"
      - ".github/workflows/gg-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium

      - name: Run gg test suite
        run: python3 -m pytest tests/test_gg.py -v
