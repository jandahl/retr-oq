name: palette

# Guards the console themes that declare a canon color palette as CSS
# custom properties (--<theme>-* in that theme's own style.css) against
# off-palette colors in their own app.js/style.css. Two checks: FAMILY
# (a wrong platform's hue, or a one-off nobody checked against the
# theme's own rainbow -- KAL-Q's SNES canvas briefly had an off-palette
# purple pill before it was fixed to reuse the theme's own button
# colors) and, for c64/gb only, GAMUT (a color the real hardware could
# not physically produce -- this found c64's screen background using a
# blue that wasn't one of the VIC-II's actual 16 colors). See
# tools/check_palette.py's docstring for exactly what each does and
# doesn't flag.
on:
  push:
    branches: [master]
  pull_request: {}

jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_palette.py
